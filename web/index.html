<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Claude Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%277%27 fill=%27%23d97757%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1>Claude Dashboard</h1>
      <span id="conn" class="conn conn-off" role="status" aria-live="polite">conectando…</span>
    </div>
    <div class="counters" aria-label="Resumen">
      <button type="button" id="c-waiting" class="counter c-waiting" aria-pressed="false" title="Filtrar por este estado"><b id="n-waiting">0</b> esperándote</button>
      <button type="button" id="c-busy" class="counter c-busy" aria-pressed="false" title="Filtrar por este estado"><b id="n-busy">0</b> trabajando</button>
      <button type="button" id="c-idle" class="counter c-idle" aria-pressed="false" title="Filtrar por este estado"><b id="n-idle">0</b> idle</button>
    </div>
    <div class="filters">
      <label>Proyecto
        <select id="f-project"><option value="">Todos</option></select>
      </label>
      <label class="check"><input type="checkbox" id="f-done"> ocultar done</label>
      <label class="check"><input type="checkbox" id="f-idle"> ocultar idle</label>
      <label class="check"><input type="checkbox" id="f-group"> agrupar por plan</label>
      <label class="search">Buscar
        <input type="search" id="f-search" placeholder="/ para buscar" autocomplete="off" spellcheck="false">
      </label>
      <button type="button" id="btn-notify" aria-pressed="false">activar avisos</button>
      <button type="button" id="btn-history">📊 historial</button>
    </div>
  </header>
  <main>
    <p id="empty" class="empty" hidden>No hay sesiones para mostrar.</p>
    <section id="grid" class="grid" aria-label="Sesiones"></section>
  </main>
  <div id="history" class="overlay" hidden>
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="history-title">
      <div class="panel-head">
        <h2 id="history-title">Historial de tokens (30 días)</h2>
        <button type="button" id="history-close" aria-label="Cerrar (Esc)">✕</button>
      </div>
      <div id="history-body" class="panel-body"></div>
    </div>
  </div>
  <div id="timeline" class="overlay" hidden>
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="timeline-title">
      <div class="panel-head">
        <h2 id="timeline-title"></h2>
        <button type="button" id="timeline-close" aria-label="Cerrar (Esc)">✕</button>
      </div>
      <div id="timeline-body" class="panel-body"></div>
    </div>
  </div>
  <div id="phone" class="overlay" hidden>
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="phone-title">
      <div class="panel-head">
        <h2 id="phone-title">Abrir en el teléfono</h2>
        <button type="button" id="phone-close" aria-label="Cerrar (Esc)">✕</button>
      </div>
      <div id="phone-body" class="panel-body phone-body"></div>
    </div>
  </div>
  <script src="vendor/qrcode.js"></script>
  <script src="app.js"></script>
</body>
</html>
